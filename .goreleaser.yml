# goreleaser config — drives builds, archives, .deb packaging, and
# GitHub release publication. Run locally with `goreleaser release
# --snapshot --clean` for a dry-run; CI invokes `goreleaser release
# --clean` on tag push.

version: 2

project_name: vault-cert-agent

before:
  hooks:
    - go mod tidy

builds:
  - id: vault-cert-agent
    main: ./cmd/vault-cert-agent
    binary: vault-cert-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: vault-cert-agent
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - packaging/config.example.hcl
      - packaging/vault-cert-agent.service
      - packaging/vault-cert-agent.timer

nfpms:
  - id: vault-cert-agent
    package_name: vault-cert-agent
    vendor: ophymx
    homepage: https://github.com/ophymx/vault-cert-agent
    maintainer: Jeffrey T. Peckham <abic@ophymx.com>
    description: |-
      vault-cert-agent fetches TLS material from HashiCorp Vault and writes
      it to disk for local consumers (postgres, haproxy, pgpool, etc.).
      .
      Replaces the older vault-pki-renew and vault-cert-renew bash scripts
      with a single typed Go implementation driven by a systemd timer that
      runs hourly.
    section: admin
    priority: optional
    formats:
      - deb
    # Goreleaser places the built binary under bindir automatically.
    bindir: /usr/sbin
    contents:
      - src: packaging/vault-cert-agent.service
        dst: /usr/lib/systemd/system/vault-cert-agent.service
        file_info:
          mode: 0644
      - src: packaging/vault-cert-agent.timer
        dst: /usr/lib/systemd/system/vault-cert-agent.timer
        file_info:
          mode: 0644
      - src: packaging/config.example.hcl
        dst: /usr/share/doc/vault-cert-agent/config.example.hcl
        file_info:
          mode: 0644
      # /etc/vault-cert-agent is a ghost: postinstall creates it
      # 0700 root:root so AppRole creds dropped in aren't world-readable.
      - dst: /etc/vault-cert-agent
        type: ghost
        file_info:
          mode: 0700
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
